name: HiddenYatra CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Syntax Check
        run: |
          python -m compileall app.py config.py models routes utils tests

      - name: Minify Static Assets Check
        run: |
          python scripts/tools/minify_assets.py

      - name: Diagnose utils module (filesystem)
        continue-on-error: true
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== ls utils/ ==="
          ls -la utils/
          echo "=== head utils/__init__.py ==="
          head -30 utils/__init__.py

      - name: Diagnose utils module (Python resolution)
        continue-on-error: true
        run: |
          python -c "import sys; print('sys.path:', sys.path)"
          python -c "import utils; print('utils module:', utils); print('utils __file__:', getattr(utils, '__file__', None)); print('utils members:', dir(utils)); print('has csrf_required:', hasattr(utils, 'csrf_required'))"
          python -c "import importlib; spec = importlib.util.find_spec('utils'); print('utils spec:', spec); print('origin:', spec.origin if spec else 'N/A')"
          pip show utils 2>&1 || echo "No pip package named utils installed"

      - name: Run Test Suite
        env:
          SECRET_KEY: test-ci-secret-key-for-github-actions
          ADMIN_PASSWORD: admin@hidden123
          FLASK_ENV: testing
          TESTING: "True"
        run: |
          python -m unittest discover tests -v
