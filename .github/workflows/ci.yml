name: HiddenYatra CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Syntax Check
        run: |
          python -m compileall app.py config.py models routes utils tests

      - name: Minify Static Assets Check
        run: |
          python scripts/tools/minify_assets.py

      - name: Verify Cover Images Integrity
        env:
          SECRET_KEY: test-ci-secret-key-for-github-actions
          ADMIN_PASSWORD: admin@hidden123
          FLASK_ENV: testing
          TESTING: "True"
        run: |
          python scripts/seed/verify_cover_images.py

      - name: Run Test Suite
        env:
          SECRET_KEY: test-ci-secret-key-for-github-actions
          ADMIN_PASSWORD: admin@hidden123
          FLASK_ENV: testing
          TESTING: "True"
        run: |
          python -m unittest discover tests -v
