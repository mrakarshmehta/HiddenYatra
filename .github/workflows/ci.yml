name: HiddenYatra CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Start MySQL Database
        run: |
          sudo systemctl start mysql.service
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS hiddenyatra_db;"
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'root'; FLUSH PRIVILEGES;" || sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED BY 'root'; FLUSH PRIVILEGES;"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Syntax Check
        run: |
          python -m compileall app.py config.py models routes utils tests

      - name: Minify Static Assets Check
        run: |
          python scripts/tools/minify_assets.py

      - name: Run Test Suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: hiddenyatra_db
          DB_USER: root
          DB_PASSWORD: root
          SECRET_KEY: test-ci-secret-key-for-github-actions
          ADMIN_PASSWORD: admin@hidden123
          FLASK_ENV: testing
          TESTING: "True"
        run: |
          python -m unittest discover tests -v
