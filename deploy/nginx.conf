# ═══════════════════════════════════════════════════════
# HiddenYatra — Nginx Production Configuration
# Place at: /etc/nginx/conf.d/hiddenyatra.conf
# ═══════════════════════════════════════════════════════

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=hiddenyatra_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=hiddenyatra_login:10m rate=3r/m;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name hiddenyatra.com www.hiddenyatra.com;

    # Allow Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hiddenyatra.com www.hiddenyatra.com;

    # ── SSL ──
    ssl_certificate     /etc/letsencrypt/live/hiddenyatra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hiddenyatra.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (enable after SSL is confirmed working)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Security Headers ──
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # ── Request Limits ──
    client_max_body_size 16M;

    # ── Static Files (served directly by Nginx) ──
    location /static/ {
        alias /var/www/hiddenyatra/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Specific cache for CSS/JS (shorter for development flexibility)
        location ~* \.(css|js)$ {
            expires 1d;
            add_header Cache-Control "public";
        }

        # Images — longer cache
        location ~* \.(jpg|jpeg|png|webp|gif|ico|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Upload Files ──
    location /static/uploads/ {
        alias /var/www/hiddenyatra/static/uploads/;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Favicon ──
    location = /favicon.ico {
        alias /var/www/hiddenyatra/static/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # ── Rate-limited login routes ──
    location ~ ^/(login|signup|admin/login|forgot-password) {
        limit_req zone=hiddenyatra_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health Check (no logging) ──
    location = /health {
        proxy_pass http://127.0.0.1:5000/health;
        access_log off;
    }

    # ── Application (Gunicorn upstream) ──
    location / {
        limit_req zone=hiddenyatra_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
        proxy_connect_timeout 10;
    }

    # ── Block sensitive files ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|py|pyc|db|sqlite3|sql|sh|md|yml|yaml|toml|cfg|ini|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
