# ═══════════════════════════════════════════════════════
# HiddenYatra — Docker Compose (VPS Deployment)
# Full stack: Flask + MySQL 8.4 + Nginx
# Usage: docker compose up -d
# ═══════════════════════════════════════════════════════

services:
  # ── MySQL Database ──
  db:
    image: mysql:8.4
    container_name: hiddenyatra-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: hiddenyatra
      MYSQL_USER: hiddenyatra_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"   # Only accessible from localhost
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/migrations/mysql_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  # ── Flask Application ──
  app:
    build: .
    container_name: hiddenyatra-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: hiddenyatra
      DB_USER: hiddenyatra_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: 5
      DB_POOL_MAX: 20
      GUNICORN_WORKERS: 4
      GUNICORN_THREADS: 2
      FORWARDED_ALLOW_IPS: "172.16.0.0/12"
    volumes:
      - uploads:/app/static/uploads
    networks:
      - backend

  # ── Nginx Reverse Proxy ──
  nginx:
    image: nginx:alpine
    container_name: hiddenyatra-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/var/www/hiddenyatra/static:ro
      - uploads:/var/www/hiddenyatra/static/uploads:ro
      - ssl_certs:/etc/letsencrypt:ro
    networks:
      - backend

volumes:
  mysql_data:
    driver: local
  uploads:
    driver: local
  ssl_certs:
    driver: local

networks:
  backend:
    driver: bridge
