{% extends "base.html" %}
{% block title %}Server Error — {{ app_name }}{% endblock %}

{% block content %}
<section style="text-align:center;padding:var(--space-3xl) var(--space-lg);max-width:500px;margin:0 auto;">
  <span style="font-size:5rem;display:block;margin-bottom:var(--space-lg);">⚠️</span>
  <h1 style="font-family:var(--font-heading);font-size:2rem;margin-bottom:var(--space-md);">Something Went Wrong</h1>
  <p style="color:var(--text-muted);margin-bottom:var(--space-xl);">We're sorry, something unexpected happened. Please try again later.</p>
  <a href="{{ url_for('main.index') }}" class="btn btn-primary">← Back to Home</a>
</section>
{% endblock %}
