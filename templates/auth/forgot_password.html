{% extends "base.html" %}
{% block title %}Forgot Password — {{ app_name }}{% endblock %}

{% block extra_css %}
<style>
.verify-page {
  min-height:calc(100vh - var(--navbar-height));
  display:flex; align-items:center; justify-content:center;
  padding:var(--space-xl);
  background: radial-gradient(ellipse at top, rgba(249,115,22,0.06) 0%, transparent 60%);
}
.verify-card {
  width:100%; max-width:440px;
  background:var(--bg-card); border:1px solid var(--border-color);
  border-radius:16px; padding:36px; text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,0.12);
  animation: slideUp 0.5s ease-out;
}
.verify-icon { font-size:3.5rem; margin-bottom:16px; }
.verify-card h1 { font-family:var(--font-heading); font-size:1.4rem; margin-bottom:8px; }
.verify-card .sub { color:var(--text-muted); font-size:0.88rem; margin-bottom:28px; }

.form-group-auth { margin-bottom:18px; text-align:left; }
.form-group-auth label { display:block; font-size:0.78rem; font-weight:600; color:var(--text-secondary); margin-bottom:5px; }
.input-wrapper {
  display:flex; align-items:center;
  background:var(--bg-elevated); border:1.5px solid var(--border-color);
  border-radius:10px; transition:all 0.3s;
}
.input-wrapper:focus-within { border-color:#F97316; box-shadow:0 0 0 3px rgba(249,115,22,0.15); }
.input-wrapper input {
  flex:1; background:transparent; border:none; outline:none;
  padding:13px 14px; font-size:0.9rem; color:var(--text-primary); font-family:var(--font-body);
}
.input-wrapper input::placeholder { color:var(--text-muted); }
.input-icon { padding:0 12px; color:var(--text-muted); font-size:1rem; }

.btn-auth {
  width:100%; padding:13px; border:none; border-radius:10px;
  background:linear-gradient(135deg,#F97316,#EA580C);
  color:#fff; font-size:0.95rem; font-weight:700;
  cursor:pointer; transition:all 0.3s; font-family:var(--font-body);
}
.btn-auth:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(249,115,22,0.35); }
.back-link { display:block; margin-top:20px; color:var(--text-muted); font-size:0.82rem; }
.back-link a { color:#F97316; }

@keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
</style>
{% endblock %}

{% block content %}
<div class="verify-page">
  <div class="verify-card">
    <div class="verify-icon" style="display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-md);">
      <img src="{{ url_for('static', filename='logo-icon.svg') }}" alt="HiddenYatra Logo" width="48" height="48" style="display:block;">
    </div>
    <h1>Forgot Your Password?</h1>
    <p class="sub">Enter your email and we'll send a reset code</p>

    <form method="POST">
      {{ csrf_input() }}
      <div class="form-group-auth">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" name="email" id="email" placeholder="your@email.com" required autofocus>
        </div>
      </div>
      <button type="submit" class="btn-auth">Send Reset Code →</button>
    </form>
    <div class="back-link"><a href="{{ url_for('auth.login') }}">← Back to login</a></div>
  </div>
</div>
{% endblock %}
